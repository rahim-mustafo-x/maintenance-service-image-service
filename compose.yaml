services:
  image-service:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: image-service

    env_file:
      - .env

    ports:
      - "${PORT}:${PORT}"

    restart: unless-stopped

    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      service-registry:
        condition: service_healthy